# Vercel's free Hobby plan only allows cron jobs that run once a day, which
# is no good for "15 minutes before" reminders — so GitHub Actions pings the
# reminder route instead. Needs two repo secrets (Settings > Secrets and
# variables > Actions): APP_URL (e.g. https://acacia-chapter.vercel.app) and
# CRON_SECRET (same value as the Vercel env var). GitHub may run these a few
# minutes late; the route sends anything that is due, so a late run is fine.
name: event-reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reminders"
